<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>点歌台 · 曲库文件夹</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b0e1a;--card:rgba(28,34,54,.72);--line:rgba(255,255,255,.09);--txt:#eef1ff;--sub:#93a0c4;--accent:#22c9a6;--pink:#e8517a;--gold:#ffe27a}
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:radial-gradient(1100px 560px at 8% -12%,#2b2352,transparent),radial-gradient(900px 480px at 102% 0,#103b45,transparent),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;padding:14px 16px 12px;background:rgba(11,14,26,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:19px;letter-spacing:.6px;flex:1}
.links a{text-decoration:none;font-size:12px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--sub);white-space:nowrap;display:inline-block;margin-left:6px}
main{max-width:820px;margin:0 auto;padding:18px 16px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h2{margin:0 0 12px;font-size:15px;color:var(--sub);font-weight:600}
.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--accent);word-break:break-all;background:rgba(10,14,26,.6);padding:11px 12px;border-radius:9px;border:1px solid var(--line);line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0}
button{font-family:inherit;font-size:13px;padding:10px 15px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);cursor:pointer;white-space:nowrap}
button.pri{background:var(--accent);color:#05251f;border:0;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus,input:focus,a:focus{outline:3px solid var(--gold);outline-offset:2px}
input[type=file]{font-size:13px;color:var(--sub);max-width:100%}
.msg{font-size:13px;line-height:1.7;color:var(--sub);margin:10px 0 0;word-break:break-word}
.msg.ok{color:var(--accent)}.msg.err{color:#ffb9cb}
.tip{font-size:12px;color:var(--sub);line-height:1.85;margin:12px 0 0;opacity:.9}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-size:11px;font-weight:600}
td.n{word-break:break-all;max-width:52vw}
td.s{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:11px;color:var(--accent);border:1px solid rgba(34,201,166,.4);border-radius:5px;padding:2px 6px;white-space:nowrap}
.empty{padding:26px 4px;text-align:center;color:var(--sub);font-size:13px;line-height:1.9}
@media (max-width:720px){
  header{padding:12px;gap:8px}
  h1{font-size:17px;white-space:nowrap}
  .links a{padding:7px 9px;font-size:11px;margin-left:4px}
  main{padding:12px}
  .card{padding:14px;border-radius:13px}
  .row{gap:6px}
  .row input[type=file]{flex:1 1 100%;min-width:0;order:0}
  .row button{order:1;padding:9px 11px;font-size:12px}
  th:nth-child(4),td:nth-child(4){display:none}
  td.n{max-width:46vw}
}
</style>
</head>
<body>
<header>
  <h1>&#128193; 曲库文件夹</h1>
  <div class="links"><a href="/">点歌台</a><a href="/about">关于</a></div>
</header>
<main>
  <div class="card">
    <h2>共享目录路径</h2>
    <div class="path" id="path">—</div>
    <div class="row">
      <button class="pri" onclick="copyPath()">复制完整路径</button>
      <button onclick="openDesktop()">打开飞牛桌面</button>
      <button onclick="load()">刷新列表</button>
    </div>
    <p class="tip">在飞牛「文件管理器」里进入 <b id="folderName">共享空间</b> 里的曲库文件夹，也可以直接在下方从手机上传。上传后回到点歌台的「本地曲库」刷新即可看到。</p>
  </div>

  <div class="card">
    <h2>上传歌曲 / 封面 / 歌词</h2>
    <div class="row">
      <input type="file" id="f" multiple accept=".mp3,.m4a,.flac,.wav,.aac,.ogg,.mp4,.mkv,.avi,.mov,.jpg,.jpeg,.png,.webp,.bmp,.lrc">
      <button class="pri" onclick="upload()">上传</button>
    </div>
    <p class="msg" id="msg">支持一次选择多个文件；同名歌曲与封面、歌词会自动配对。</p>
    <p class="tip">命名规则：<b>001-歌名-歌手.mp4</b>（或 .mp3）。同名 <b>.lrc</b> 为歌词，同名 <b>.jpg / .png</b> 或目录里的 cover.jpg 为封面；<b>xxx-原唱.mp3</b> 与 <b>xxx-伴奏.mp3</b> 会配成一首歌的两条音轨，可在播放时切换。</p>
  </div>

  <div class="card">
    <h2>文件列表 <span id="count" style="color:var(--accent);font-size:12px"></span></h2>
    <div id="list"><div class="empty">正在加载…</div></div>
  </div>
</main>
<script>
var el=function(i){return document.getElementById(i)},curPath='';
function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){var x=new XMLHttpRequest();x.open('GET','/api/files',true);
 x.onreadystatechange=function(){if(x.readyState!==4)return;var d=null;
  try{d=JSON.parse(x.responseText)}catch(e){}
  if(!d){el('list').innerHTML='<div class="empty">加载失败，请稍后重试</div>';return}
  curPath=d.path;el('path').textContent=d.label||d.path;
  el('folderName').textContent='共享空间 / '+(d.folder||'曲库')+' / music';
  el('count').textContent=d.files.length?('· '+d.files.length+' 个文件'):'';
  if(!d.files.length){el('list').innerHTML='<div class="empty">曲库文件夹还是空的<br>上传歌曲，或在飞牛文件管理器里把歌曲放进上面的目录</div>';return}
  var h='<table><tr><th>文件名</th><th>类型</th><th>大小</th><th>修改时间</th></tr>';
  for(var i=0;i<d.files.length;i++){var f=d.files[i];
   h+='<tr><td class="n">'+esc(f.name)+'</td><td><span class="tag">'+f.kind+'</span></td>'+
      '<td class="s">'+fmt(f.size)+'</td><td class="s">'+new Date(f.mtime*1000).toLocaleDateString()+'</td></tr>'}
  el('list').innerHTML=h+'</table>'};
 x.onerror=function(){el('list').innerHTML='<div class="empty">加载失败</div>'};x.send()}
function copyPath(){var u=curPath;
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(
  function(){el('msg').textContent='已复制：'+u;el('msg').className='msg ok'},
  function(){prompt('复制此路径',u)})}else{prompt('复制此路径',u)}}
function openDesktop(){var u=location.protocol+'//'+location.hostname+'/';
 window.open(u,'_blank');el('msg').textContent='已打开飞牛桌面，请在文件管理器里进入上面的共享文件夹';el('msg').className='msg'}
function upload(){var fs=el('f').files;if(!fs.length){el('msg').textContent='请先选择文件';return}
 var fd=new FormData();for(var i=0;i<fs.length;i++)fd.append('f'+i,fs[i]);
 var x=new XMLHttpRequest();x.open('POST','/api/files/upload',true);
 el('msg').textContent='正在上传 '+fs.length+' 个文件…';el('msg').className='msg';
 x.onreadystatechange=function(){if(x.readyState!==4)return;var d=null;
  try{d=JSON.parse(x.responseText)}catch(e){}
  if(d&&d.ok){el('msg').textContent='已上传 '+d.files.length+' 个文件';el('msg').className='msg ok';
   el('f').value='';load()}else{el('msg').textContent='上传失败：'+(d&&d.error||'未知错误');el('msg').className='msg err'}};
 x.onerror=function(){el('msg').textContent='上传失败';el('msg').className='msg err'};x.send(fd)}
load();
</script>
</body>
</html>
